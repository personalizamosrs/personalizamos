<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartão Digital - Leandro Miyasaki</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background-color: #384454;
      background-image: url("./lfundo.jpg");
      background-size: cover;
      background-position: center center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: #e6e9ee;
      min-height: 100vh;
      padding: 16px 16px 40px;
    }

    .card {
      max-width: 640px;
      margin: 0 auto;
      text-align: center;
      padding-top: 14px;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
    }

    /* Avatar */
    .avatar {
      width: 78px;
      height: 78px;
      border-radius: 8px;
      object-fit: cover;
      border: 3px solid #4a5666;
      margin-bottom: 14px;
    }

    .logo-img {
      height: 62px;
      width: auto;
      border-radius: 8px;
      object-fit: contain;
      border: 3px solid #4a5666;
      margin-top: 18px;
      display: inline-block;
    }

    .name {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .role {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 32px;
    }

    /* Sections */
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 14px;
    }

    .icons {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 14px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background-color: #566170;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease;
      text-decoration: none;
    }

    .icon-btn:hover {
      background-color: #63707f;
    }

    .icon-btn svg {
      width: 17px;
      height: 17px;
      fill: #ffffff;
    }

    .icon-btn.ig { background-color: #566170; }
    .icon-btn.in { background-color: #0a66c2; }

    .contact-text {
      color: #ffffff;
      font-size: 13px;
      margin-bottom: 36px;
    }

    .contact-text:last-of-type {
      margin-bottom: 18px;
    }

    .contact-text a {
      color: #ffffff;
      text-decoration: none;
    }

    .contact-text a:hover {
      text-decoration: underline;
    }

    .section-spacer {
      margin-bottom: 36px;
    }

    .cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: fit-content;
      min-height: 30px;
      padding: 0 12px;
      border-radius: 8px;
      background-color: #566170;
      border: none;
      color: #ffffff;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-decoration: none;
      text-shadow: none;
      cursor: pointer;
      transition: background-color 0.15s ease;
      margin: 0 auto 14px;
    }

    .cta-btn:hover {
      background-color: #63707f;
    }

    .cta-btn svg {
      width: 14px;
      height: 14px;
      fill: #ffffff;
    }
  </style>
</head>
